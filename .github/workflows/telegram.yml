# 发版推送到 Telegram 群的「更新记录」话题：推送且 PANEL_VERSION 变了时，把这一版的 CHANGELOG 条目发到群里
# 只在公开仓库 Skycnhe/Shunt-release 运行（2026-11-28 起；私库 Actions 免费分钟数不够，且避免两边重复发送）。
# 文件经 tools/public-files.txt 发布到公开仓库；公开仓库没有 shunt/base.py，版本号读 server.py（预览分支里已是 <版本>-preview.N+哈希）
# 需要公开仓库 Secret：TG_BOT_TOKEN（Settings → Secrets and variables → Actions）；没配就跳过；空白、引号、bot / api 等前缀、零宽 / 非 ASCII 字符会自动清洗
# 手动运行：mode=check 只检查机器人和群；mode=send 发当前版本；send + versions=9.2.4,9.2.5 按 CHANGELOG 里「## v<版本> 」条目逐条补发
#   （公开仓库正式分支的 CHANGELOG 只留最新一条，更早的版本从本分支 git 历史里找）
name: Telegram notify

on:
  push:
    branches: [shunt, shunt-singbox, shunt-preview, shunt-singbox-preview]
    paths:
      - server.py
      - shunt/base.py
      - CHANGELOG.md  # 预览分支按 CHANGELOG 新增的条目推送
  workflow_dispatch:
    inputs:
      mode:
        description: check = 只检查机器人和群配置，不发消息；send = 发送更新记录
        type: choice
        options: [check, send]
        default: check
      versions:
        description: 可选，补发指定版本（逗号分隔，如 9.2.4,9.2.5），按 CHANGELOG 里 ## v<版本> 条目逐条发送；留空 = 当前版本
        type: string
        default: ""

permissions:
  contents: read

jobs:
  notify:
    if: github.repository == 'Skycnhe/Shunt-release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PANEL_VERSION 变化时推送
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID || '-1003950239027' }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID || '8' }}  # 群里「更新记录」话题
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          VERSIONS: ${{ inputs.versions }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          # 清洗 secret（粘贴时常带进来的东西），只报告清洗掉的类别，绝不输出 token：
          #   空白（空格、\r、\n、\t）→ 非 ASCII 可打印字符（零宽字符、BOM、全角符号等）→ 首尾引号 ' " → 开头的 bot 前缀（大小写不敏感）→ 其他非数字前缀（api、token= 等）
          RAW_LEN=$(printf %s "$TG_BOT_TOKEN" | LC_ALL=C wc -c | tr -d ' ')
          CLEANED=""
          T=$(printf %s "$TG_BOT_TOKEN" | tr -d '[:space:]')
          [ "$T" = "$TG_BOT_TOKEN" ] || CLEANED="$CLEANED 空白"
          T2=$(printf %s "$T" | LC_ALL=C tr -cd '\041-\176')
          [ "$T2" = "$T" ] || CLEANED="$CLEANED 非ASCII"
          T=$T2
          T2=$(printf %s "$T" | sed -E "s/^[\"']+//; s/[\"']+\$//")
          [ "$T2" = "$T" ] || CLEANED="$CLEANED 引号"
          T=$T2
          T2=$(printf %s "$T" | sed -E 's/^[Bb][Oo][Tt]([0-9])/\1/')
          [ "$T2" = "$T" ] || CLEANED="$CLEANED bot前缀"
          T=$T2
          # 其他非数字前缀（如 api、token=）：从第一个「数字串:」开始取
          T2=$(printf %s "$T" | sed -E 's/^[^0-9]*([0-9]+:)/\1/')
          [ "$T2" = "$T" ] || CLEANED="$CLEANED 非数字前缀"
          TG_BOT_TOKEN=$T2; unset T T2
          [ -n "$TG_BOT_TOKEN" ] || { echo "::notice::没有配置 TG_BOT_TOKEN（或清洗后为空），跳过"; exit 0; }
          echo "::add-mask::$TG_BOT_TOKEN"
          CLEANED=${CLEANED# }
          TOKEN_INFO="清洗前 ${RAW_LEN} 字节，清洗后 ${#TG_BOT_TOKEN} 字节，清洗掉：${CLEANED:-无}"
          echo "TG_BOT_TOKEN：$TOKEN_INFO"
          # 只拦明显不是 token 的情况（没有冒号）；其余交给 Telegram getMe 判断
          case "$TG_BOT_TOKEN" in
            *:*) ;;
            *) echo "::error::TG_BOT_TOKEN 不像机器人 token（应为 数字:字符串，没有冒号）：$TOKEN_INFO"; exit 1 ;;
          esac
          if [ "$EVENT" = workflow_dispatch ] && [ "$MODE" != send ]; then
            api() { curl -sS "https://api.telegram.org/bot$TG_BOT_TOKEN/$1" "${@:2}"; }
            ME=$(api getMe || true)
            echo "$ME" | jq -e .ok >/dev/null 2>&1 || { echo "::error::getMe 失败：$(echo "$ME" | jq -r '"\(.error_code // "") \(.description // "无返回")"' 2>/dev/null || echo 无法解析返回)；$TOKEN_INFO"; exit 1; }
            echo "机器人：@$(echo "$ME" | jq -r .result.username)"
            CH=$(api getChat --data-urlencode "chat_id=$TG_CHAT_ID"); echo "$CH" | jq -e .ok >/dev/null || { echo "::error::群 $TG_CHAT_ID 不可用：$(echo "$CH" | jq -r .description)"; exit 1; }
            echo "群：$(echo "$CH" | jq -r .result.title)（话题模式：$(echo "$CH" | jq -r .result.is_forum)，话题 ID $TG_THREAD_ID）"
            MB=$(api getChatMember --data-urlencode "chat_id=$TG_CHAT_ID" --data-urlencode "user_id=$(echo "$ME" | jq -r .result.id)")
            echo "机器人在群里的身份：$(echo "$MB" | jq -r '.result.status // .description')"
            echo "::notice::配置正确，发版时会推送到这个群的话题 $TG_THREAD_ID"
            exit 0
          fi
          send() {  # $1 = 消息文件
            python3 -c "t=open('$1',encoding='utf-8').read(); open('msg4k.txt','w',encoding='utf-8').write(t if len(t)<=3800 else t[:3790]+'…')"  # 按字符截断（按字节截会切坏 UTF-8，Telegram 返回 400）
            R=$(curl -sS "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TG_CHAT_ID" --data-urlencode "message_thread_id=$TG_THREAD_ID" --data-urlencode "text@msg4k.txt" \
              --data-urlencode "disable_web_page_preview=true" || true)
            echo "$R" | jq -e .ok >/dev/null 2>&1 || { echo "::error::sendMessage 失败：$(echo "$R" | jq -r '"\(.error_code // "") \(.description // "无返回")"' 2>/dev/null || echo 无法解析返回)"; return 1; }
          }
          ver() { sed -n 's/^PANEL_VERSION = "\(.*\)"/\1/p' "$@" | head -n 1; }
          # 某个版本的 CHANGELOG 条目（标题以「## v<版本> 」开头）：先看当前 CHANGELOG，没有再按时间倒序找本分支历史里的 CHANGELOG
          entry() {  # $1 = 版本，$2 = 输出文件；找不到返回 1
            awk -v v="## v$1 " 'index($0, v)==1{p=1;print;next} p&&/^## v/{p=0} p' CHANGELOG.md > "$2"
            [ -s "$2" ] && return 0
            for c in $(git log --format=%H -- CHANGELOG.md); do
              git show "$c:CHANGELOG.md" 2>/dev/null | awk -v v="## v$1 " 'index($0, v)==1{p=1;print;next} p&&/^## v/{p=0} p' > "$2" || true
              [ -s "$2" ] && { echo "v$1 的条目取自历史提交 ${c:0:7}"; return 0; }
            done
            return 1
          }
          if [ -f server.py ]; then V=$(ver server.py); else V=$(ver shunt/base.py); fi
          [ -n "$V" ] || { echo "读不到 PANEL_VERSION"; exit 1; }
          case "$BRANCH" in *-preview) PREV=1 ;; *) PREV="" ;; esac
          # 补发：逐条发送指定版本的 CHANGELOG 条目
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$(echo "$VERSIONS" | tr -d ' ,')" ]; then
            FAIL=0
            for x in $(echo "$VERSIONS" | tr ',' ' '); do
              x=${x#v}
              if ! entry "$x" e.txt; then echo "::error::CHANGELOG 里找不到 ## v$x 条目，没有发送"; FAIL=1; continue; fi
              if [ -n "$PREV" ]; then
                { echo "🧪 Shunt 预览版 [$BRANCH] v$x（补发）"; echo; head -n 1 e.txt | sed 's/^## //'; tail -n +2 e.txt | sed -n '/^- /p'; echo; echo "面板：设置 → 在线更新 → 预览版"; } | sed 's/`//g' > msg.txt
              else
                { echo "🚀 Shunt [$BRANCH]（补发）"; sed '1s/^## //' e.txt; echo; echo "https://github.com/Skycnhe/Shunt-release/blob/$BRANCH/CHANGELOG.md"; } | sed 's/`//g' > msg.txt
              fi
              cat msg.txt
              send msg.txt
              echo "已推送 v$x 到 Telegram"
            done
            exit $FAIL
          fi
          if [ -n "$PREV" ]; then
            # 预览版：版本号与 publish.sh --preview 一致（<版本>-preview.<提交数>+<短哈希>），发 CHANGELOG 里这次新增的条目
            case "$V" in
              *-preview.*) PV=$V ;;
              *) if [ -f shunt/base.py ]; then PV="$V-preview.$(git rev-list --count HEAD)+$(git rev-parse --short=7 HEAD)"
                 else echo "版本 v$V 不是预览版本号（正式发布同步到预览分支），跳过"; exit 0; fi ;;
            esac
            if [ "$EVENT" = push ]; then
              B="${BEFORE:-}"
              if [ -z "$B" ] || ! git cat-file -e "$B^{commit}" 2>/dev/null; then B=$(git rev-parse -q --verify HEAD^ || true); fi
              [ -n "$B" ] || { echo "没有上一个提交，跳过"; exit 0; }
              git diff -U0 "$B" HEAD -- CHANGELOG.md | sed -n 's/^+\(- .*\)/\1/p' | sed 's/`//g' > new.txt
            else
              awk 'index($0,"## v")==1{n++} n==1&&/^- /' CHANGELOG.md | sed 's/`//g' > new.txt
            fi
            [ -s new.txt ] || { echo "CHANGELOG 没有新增条目，跳过"; exit 0; }
            { echo "🧪 Shunt 预览版 [$BRANCH] v$PV"; echo; cat new.txt; echo; echo "面板：设置 → 在线更新 → 预览版"; } > msg.txt
            cat msg.txt
            send msg.txt
            echo "已推送预览版 v$PV 到 Telegram"
            exit 0
          fi
          if [ "$EVENT" = push ]; then
            B="${BEFORE:-}"
            if [ -z "$B" ] || ! git cat-file -e "$B^{commit}" 2>/dev/null; then B=$(git rev-parse -q --verify HEAD^ || true); fi
            [ -n "$B" ] || { echo "没有上一个提交，跳过"; exit 0; }
            if [ -f server.py ]; then OLD=$(git show "$B:server.py" 2>/dev/null | ver || true); else OLD=$(git show "$B:shunt/base.py" 2>/dev/null | ver || true); fi
            [ "$OLD" != "$V" ] || { echo "PANEL_VERSION 没变（v$V），跳过"; exit 0; }
          fi
          {
            echo "🚀 Shunt [$BRANCH]"
            awk -v v="## v$V " 'index($0, v)==1{p=1;print substr($0,4);print "";next} p&&/^## v/{p=0} p' CHANGELOG.md | sed 's/`//g'
            echo
            echo "https://github.com/Skycnhe/Shunt-release/blob/$BRANCH/CHANGELOG.md"
          } > msg.txt
          cat msg.txt
          send msg.txt
          echo "已推送 v$V 到 Telegram"
